name: PR Triage / Maintainence

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - auto_merge_enabled
  workflow_dispatch:
    inputs:
      pr-num:
        type: number
        required: true
        description: PR number to approve

permissions:
  contents: write
  pull-requests: write

jobs:
  triage:
    if: (github.event.pull_request.head.repo.full_name == github.repository) && (github.event.pull_request.user.login == 'wu21-web' || github.event.pull_request.user.login == 'dependabot[bot]') && (github.event_name == 'pull_request_target' )
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        if: >
          (github.event.pull_request.user.login == 'dependabot[bot]' && github.event.action == 'opened') ||
          (github.event.pull_request.user.login == 'wu21-web' &&
           github.event.action == 'auto_merge_enabled' &&
           contains(github.event.pull_request.labels.*.name, 'auto-approve'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve --repo ${{ github.repository }}

      - name: Enable Auto Merge for Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.auto_merge == null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --rebase --repo ${{ github.repository }}

  dispatch:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'wu21-web'
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review ${{ inputs.pr-num }} --approve --repo ${{ github.repository }}
