name: Windows scheduling

on:
  push:
    branches: [main, integrations]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/windows-scheduling.ps1
      - name: Test with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/windows-scheduling.ps1
