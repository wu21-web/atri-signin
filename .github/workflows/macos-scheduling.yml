name: macOS scheduling

on:
  push:
    branches: [main, applescript]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts
        run: |
          shellcheck examples/integrations/launchd-job.sh \
            examples/integrations/remove-launchd-job.sh \
            tests/macos-scheduling.sh

  test:
    runs-on: macos-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test the launchd installer
        env:
          ATRI_SIGNIN_TEST_BOOTSTRAP: "1"
        run: ./tests/macos-scheduling.sh
