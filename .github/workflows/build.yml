name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - darwin
          - windows
        goarch:
          - amd64
          - arm64
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          extension=""
          if [ "$GOOS" = "windows" ]; then
            extension=".exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "dist/atri-signin-${GOOS}-${GOARCH}${extension}" ./cmd/atri-signin

      - name: Attest artifact
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: atri-signin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
